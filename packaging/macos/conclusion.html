<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>开始使用 FileSync</title>
<style>body{font:14px -apple-system,sans-serif;color:#283f37;line-height:1.7;padding:12px}h1{font-size:24px}li{margin:8px 0}</style></head>
<body><h1>安装完成后</h1><ol><li>从“应用程序”打开 FileSync。</li><li>向中心管理员获取中心地址、这台电脑的节点 ID 和节点令牌。</li><li>填写连接信息，点击“连接并启动同步”。</li></ol>
<p>每台电脑使用各自的节点凭证。管理员配置分发关系后，客户端会自动显示对应的发布或接收菜单。</p>
<p>连接远程中心时，请填写管理员提供的网络地址。</p></body></html>
