<html lang="zh-CN"><head><meta charset="utf-8"><title>安装 FileSync</title>
<style>body{font:14px -apple-system,sans-serif;color:#283f37;line-height:1.7;padding:12px}h1{font-size:24px}li{margin:8px 0}</style></head>
<body><h1>欢迎安装 FileSync</h1><p>团队文件分发桌面客户端，支持 Intel 和 M 系列 Mac。</p>
<p>安装程序会将 FileSync 放入这台电脑的“应用程序”目录。安装时需要电脑管理员授权。</p>
<ul><li>上游选择本机文件或目录发布。</li><li>下游选择保存位置后接收文件。</li><li>关闭窗口后，后台继续同步。</li></ul>
<p>如果电脑上已有旧版，请先退出 FileSync 界面并停止旧版后台同步，再进行升级。</p></body></html>
