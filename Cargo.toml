[package]
name = "filesync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Two-tier file distribution with explicit downstream claims"
publish = false

[features]
default = ["web"]
web = []

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
fs2 = "0.4"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "fs", "time", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
